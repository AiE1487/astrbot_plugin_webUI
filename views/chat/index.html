<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>对话 · astrbot_plugin_webui</title>
  <!-- 静态资源一律普通相对路径：宿主经带 token 的 content_path 鉴权
       （skill references/06；不要硬编码内容 URL 或自行拼 asset_token）。
       不引用参考站素材/字体文件（R5）；所有文案运行时经 t() 读取 i18n。 -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/chat.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <!-- 加载屏（§6.3）：#1e1e1e 底 + 居中 logo + 通长进度条（灰白底轨/青色进度段）
       + 左下版本号 + 中下 LOADING - XX%（等宽）+ 右下 astrbot_plugin_webui // vX.Y.Z；
       数据就绪后淡出（app.js 控制）。 -->
  <div id="loading-screen">
    <div class="ls-logo">
      <img src="./assets/logo.svg" alt="">
      <span class="ls-sub">PLUGIN VIEW</span>
    </div>
    <div class="ls-bar"><div class="ls-bar-fill" style="width:0%"></div></div>
    <div class="ls-status">➤ LOADING - 0% ......</div>
    <div class="ls-corner ls-left"></div>
    <div class="ls-corner ls-right"></div>
  </div>

  <!-- 应用外壳（§6.2 三栏：顶栏 56 / 侧栏 280 / 消息流 max-860 / 右轨 64 / 输入区）。
       各区域内容由 app.js 装配；文案一律 t()（零硬编码）。 -->
  <div id="app">
    <header id="topbar"></header>
    <aside id="sidebar"></aside>
    <!-- 手机端抽屉遮罩（W3）：仅窄视口且抽屉展开时显示，点击收起（app.js 绑定） -->
    <div id="sidebar-backdrop" aria-hidden="true"></div>
    <main id="chat-column">
      <div id="banner-slot" aria-live="polite"></div>
      <div id="chat-scroll"></div>
      <button id="jump-bottom" type="button" aria-label="scroll to bottom">
        <span class="icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg></span>
      </button>
    </main>
    <aside id="right-rail"></aside>
    <footer id="composer"></footer>
  </div>

  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif;color:#fff;background:#0d0d0d;">
      此视图需要启用 JavaScript（受限 iframe + bridge 通信）。
    </div>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
